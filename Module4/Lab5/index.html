<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Data</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Manage Data</h1>

    <h2>Latest News</h2>
    <div id="news-list"></div>

    <button id="stop-btn">Stop Reloading</button>

    <form id="news-form">
        <label for="news-title">News Item Title:</label>
        <input type="text" id="news-title">

        <label for="news-content">News Item Content:</label>
        <textarea id="news-content"></textarea>

        <button type="submit">Add News Item</button>
    </form>

    <script src="script.js"></script>
</body>

</html>
