<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake E Commerce Website</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar navbar-light bg-light border-bottom">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Fake Store</span>
        </div>
    </nav>

    <main class="container mt-4">
        <h1>Fake E Commerce Website</h1>

        <div class="row mb-4">
            <div class="col-md-4 mb-2">
                <label for="categorySelect" class="form-label">Filter by Category</label>
                <select id="categorySelect" class="form-select">
                    <option value="all">All Categories</option>
                </select>
            </div>

            <div class="col-md-4 mb-2">
                <label for="searchInput" class="form-label">Search Product</label>
                <input type="text" id="searchInput" class="form-control" placeholder="Search by title">
            </div>

            <div class="col-md-4 mb-2">
                <label for="sortSelect" class="form-label">Sort Products</label>
                <select id="sortSelect" class="form-select">
                    <option value="default">Default</option>
                    <option value="title">Title A-Z</option>
                    <option value="price-low">Price Low to High</option>
                    <option value="price-high">Price High to Low</option>
                </select>
            </div>
        </div>

        <div class="row g-4" id="productList"></div>
    </main>

    <script src="script.js"></script>
</body>

</html>
