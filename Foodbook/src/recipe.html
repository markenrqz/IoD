<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodbook | Recipe Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header>
        <div class="container header-content">
            <a class="logo" href="index.html">
                <i class="bi bi-book"></i>
                Foodbook
            </a>
            <button id="menu-button" class="menu-button" type="button">
                <i class="bi bi-list"></i>
            </button>
            <nav id="main-navigation">
                <ul>
                    <li>
                        <a href="index.html">Home</a>
                    </li>
                    <li>
                        <a href="recipes.html">Recipes</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="recipe-details-section">
            <div class="container">
                <a class="back-link" href="recipes.html">
                    <i class="bi bi-arrow-left"></i>
                    Back to Recipes
                </a>
                <article id="recipe-details" class="recipe-details">
                    <div class="recipe-details-top">
                        <div class="recipe-details-image">
                            <img id="details-image" src="" alt="" />
                        </div>
                        <div class="recipe-details-info">
                            <h1 id="details-title"></h1>
                            <p id="details-description"></p>
                            <p>
                                <strong>Cuisine:</strong>
                                <span id="details-cuisine"></span>
                            </p>
                            <p>
                                <strong>Course:</strong>
                                <span id="details-course"></span>
                            </p>
                            <p>
                                <strong>Main ingredient:</strong>
                                <span id="details-main-ingredient"></span>
                            </p>
                            <p>
                                <strong>Total time:</strong>
                                <span id="details-time"></span>
                            </p>
                            <p>
                                <strong>Servings:</strong>
                                <span id="details-servings"></span>
                            </p>

                            <p>
                                <strong>Calories:</strong>
                                <span id="details-calories"></span>
                            </p>

                            <p>
                                <strong>Fat:</strong>
                                <span id="details-fat"></span>
                            </p>

                            <p>
                                <strong>Carbohydrate:</strong>
                                <span id="details-carbohydrate"></span>
                            </p>

                            <p>
                                <strong>Fiber:</strong>
                                <span id="details-fiber"></span>
                            </p>

                            <p>
                                <strong>Protein:</strong>
                                <span id="details-protein"></span>
                            </p>
                        </div>
                    </div>
                    <div class="recipe-details-content">
                        <section>
                            <h2>Ingredients</h2>

                            <ul id="ingredients-list"></ul>
                        </section>
                        <section>
                            <h2>Directions</h2>
                            <ol id="directions-list"></ol>
                        </section>
                    </div>
                </article>
            </div>
        </section>
    </main>
    <footer>
        <div class="container footer-content">
            <p>
                &copy; <span id="current-year"></span> Foodbook
            </p>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="recipes.html">Recipes</a>
            </div>
        </div>
    </footer>
    <script type="module" src="js/index.js"></script>
</body>

</html>
