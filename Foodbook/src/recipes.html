<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodbook | Recipes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header>
        <div class="container header-content">
            <a class="logo" href="index.html">
                <i class="bi bi-book"></i>
                Foodbook
            </a>
            <button id="menu-button" class="menu-button" type="button">
                <i class="bi bi-list"></i>
            </button>
            <nav id="main-navigation">
                <ul>
                    <li>
                        <a href="index.html">Home</a>
                    </li>
                    <li>
                        <a class="active" href="recipes.html">
                            Recipes
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="page-heading">
            <div class="container">
                <h1>Recipes</h1>
                <p>
                    Search and filter recipes from the Foodbook
                    collection.
                </p>
            </div>
        </section>
        <section class="recipes-section">
            <div class="container">
                <div class="filters">
                    <div class="filter-item">
                        <label for="recipe-search">
                            Search
                        </label>
                        <input id="recipe-search" type="search" placeholder="Recipe or ingredient" />
                    </div>
                    <div class="filter-item">
                        <label for="cuisine-filter">
                            Cuisine
                        </label>
                        <select id="cuisine-filter">
                            <option value="">All cuisines</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label for="course-filter">
                            Course
                        </label>
                        <select id="course-filter">
                            <option value="">All courses</option>
                        </select>
                    </div>
                    <button id="clear-filters-button" class="button secondary-button" type="button">
                        Clear
                    </button>
                </div>
                <p id="recipe-count">
                    0 recipes found
                </p>
                <div id="no-recipes-message" class="no-recipes-message">
                    <h2>No recipes found</h2>
                    <p>
                        Try another search or filter.
                    </p>
                </div>
                <div id="all-recipes" class="recipe-list"></div>
            </div>
        </section>
    </main>
    <footer>
        <div class="container footer-content">
            <p>
                &copy; <span id="current-year"></span> Foodbook
            </p>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="recipes.html">Recipes</a>
            </div>
        </div>
    </footer>
    <template id="recipe-card-template">
        <article class="recipe-card">
            <img class="recipe-image" src="" alt="" />
            <div class="recipe-card-content">
                <h3 class="recipe-title"></h3>
                <p>
                    <strong>Cuisine:</strong>
                    <span class="recipe-cuisine"></span>
                </p>
                <p>
                    <strong>Main ingredient:</strong>
                    <span class="recipe-ingredient"></span>
                </p>
                <p>
                    <strong>Time:</strong>
                    <span class="recipe-time"></span>
                </p>
                <a class="button secondary-button recipe-link">
                    View Recipe
                </a>
            </div>
        </article>
    </template>
    <script type="module" src="js/index.js"></script>
</body>

</html>
